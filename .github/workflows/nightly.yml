name: Nightly catalog build

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # Supabase session pooler connection string (Project Settings > Database).
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Apply database migrations
        run: npx supabase@2 db push --db-url "$DATABASE_URL" --include-all --yes

      - name: Ingest from GitHub
        # Pushes rebuild the site from the catalog without calling GitHub.
        if: github.event_name != 'push'
        env:
          # Prefer a fine-grained PAT with public read access (5000 GraphQL points/hour);
          # the built-in token works too but only gets 1000 points/hour, so big runs wait on rate limits.
          GITHUB_TOKEN: ${{ secrets.CATALOG_GITHUB_TOKEN || github.token }}
          # Fresh searches run every night; a third of the topic searches rotate each night.
          TOPIC_SHARE: "0.34"
        run: npm run ingest

      - name: Export index from the catalog
        if: github.event_name == 'push'
        env:
          SKIP_HARVEST: 1
          SKIP_MEDIA: 1
        run: npm run ingest

      - run: npm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 pages deploy out --project-name libredex --branch main
